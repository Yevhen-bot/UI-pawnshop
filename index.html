<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pawnshop Network Management System - Login" />
    <title>Login - Pawnshop Network</title>
    <link rel="stylesheet" href="css/main.css" />
  </head>

  <body>
    <main class="login-page">
      <div class="login-container">
        <div class="login-card">
          <header class="login-header">
            <h1>Pawnshop Network</h1>
            <p>Sign in to your account</p>
          </header>

          <form class="login-form" action="users.html" method="get">
            <div class="form-group">
              <label class="form-label" for="username">Username</label>
              <input class="form-input" type="text" id="username" name="username" required />
            </div>

            <div class="form-group">
              <label class="form-label" for="password">Password</label>
              <input class="form-input" type="password" id="password" name="password" required />
            </div>

            <button class="btn btn-primary login-btn" type="submit">Sign In</button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
